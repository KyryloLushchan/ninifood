name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Куда публикуем. Пусто → https://kyrylolushchan.github.io/ninifood/ (basePath /ninifood).
# ninifoodvn.com → сайт в корне домена + файл CNAME. Переключение — правкой этой строки.
env:
  CUSTOM_DOMAIN: 'ninifoodvn.com'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          if [ -z "$CUSTOM_DOMAIN" ]; then export NEXT_PUBLIC_BASE_PATH=/ninifood; fi
          npm run build
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > out/CNAME; fi
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
